name: Publish Modpack
on:
  push:
    branches:
      - rusher
jobs:
  publish:
    runs-on: ubuntu-latest
    if: "contains(github.event.head_commit.message, 'release:')"
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download packwiz
        run: |
          wget -O packwiz.zip https://nightly.link/packwiz/packwiz/workflows/go/main/Linux%2064-bit%20x86.zip
          unzip packwiz.zip
          chmod +x packwiz

      - name: Export modpack
        run: ./packwiz modrinth export

      - name: Parse modpack version
        uses: SebRollen/toml-action@v1.2.0
        id: pack_version
        with:
          file: pack.toml
          field: version

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.4.1
        with:
          files: "Rusher RReinforced-*.mrpack"
          name: 'Rusher RReinforced ${{ steps.pack_version.outputs.value }}'
          tag_name: rusher-${{ steps.pack_version.outputs.value }}
          draft: true
          token: ${{ secrets.GITHUB_TOKEN }}
